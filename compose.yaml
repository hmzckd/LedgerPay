services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledgerpay
      POSTGRES_USER: ledgerpay
      POSTGRES_PASSWORD: ledgerpay
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ledgerpay
      RABBITMQ_DEFAULT_PASS: ledgerpay
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  postgres-data:
